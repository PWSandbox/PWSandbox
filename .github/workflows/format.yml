# https://pws.yarb00.dev

name: Format code

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  format:

    name: Run CSharpier

    runs-on: ubuntu-slim

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: CSharpier Check
        run: dnx csharpier check .
